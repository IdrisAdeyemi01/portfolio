    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://idris-idris.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Idris Idris, Software Engineer: I treat every feature I build like I'm its CEO." />
    <meta name="twitter:title" content="Idris Idris | Software Engineer" />

      name="twitter:description"
      content="Software Engineer specialising in production Flutter apps on iOS and Android, architecture, analytics, security, and code review."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Typography: Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Idris Idris",
        "jobTitle": "Software Engineer",
        "email": "mailto:idrisade.eedris@gmail.com",
        "url": "https://idris-idris.vercel.app/",
        "image": "https://idris-idris.vercel.app/og-image.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lagos",
          "addressCountry": "NG"
        },
        "sameAs": [
          "https://github.com/IdrisAdeyemi01",
          "https://linkedin.com/in/idris-idris"
        ],
        "knowsAbout": [
          "Flutter",
          "Dart",
          "Mobile Application Development",
          "BLoC",
          "Firebase",
          "iOS",
          "Android",
          "Code Review"
        ]
      }
    </script>

    <!-- Prevent theme flash: resolve saved theme before first paint.
         Keep the ids and storage key in sync with src/theme.ts. -->
    <script>
      (function () {
        var themes = { dark: '#090C10', light: '#FAFBFD', paper: '#F5F0E6' };
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('idris-portfolio-theme');
          if (saved && themes[saved]) theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', themes[theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
